server {
    server_name app.controla.group;

    client_max_body_size 25M;

    location /uploads/ {
        alias /var/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types {
            audio/webm webm;
            audio/ogg  ogg;
            audio/mpeg mp3;
            audio/wav  wav;
            audio/mp4  m4a;
            video/webm webmv;
            video/mp4  mp4;
            image/png  png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/gif  gif;
            application/pdf pdf;
            text/plain txt;
            application/json json;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.controla.group/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.controla.group/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.controla.group) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name app.controla.group;
    return 404;
}
